# Baseline Experiment Configuration: Lightweight 2D U-Net on ACDC Cardiac MRI
project:
  name: "cardiac_mri_segmentation_robustness"
  description: "Robustness evaluation of lightweight 2D U-Net under controlled image degradation"
  seed: 42
  deterministic: true
  device: "auto" # 'auto' selects cuda if available, else cpu

dataset:
  name: "ACDC"
  raw_dir: "data/raw/ACDC"
  processed_dir: "data/processed/ACDC"
  modalities: ["short_axis_cine_mri"]
  phases: ["ED", "ES"] # End-Diastole and End-Systole frames
  num_classes: 4
  class_labels:
    0: "background"
    1: "right_ventricle"
    2: "myocardium"
    3: "left_ventricle"
  target_spatial_size: [256, 256]
  patient_split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    stratify_by_group: true # Maintain pathology distribution across splits

model:
  architecture: "LightweightUNet2D"
  in_channels: 1
  num_classes: 4
  base_channels: 16 # Lightweight configuration for rapid training and edge deployment
  depth: 4
  dropout: 0.1
  use_batchnorm: true
  bilinear_upsample: true

training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  loss_function: "DiceCELoss"
  lr_scheduler: "CosineAnnealingLR"
  min_lr: 0.00001
  early_stopping_patience: 10
  mixed_precision: false # Set true on GPU with Tensor Cores
  checkpoint_dir: "checkpoints"
  save_best_only: true

evaluation:
  metrics:
    - "dice_per_class"
    - "mean_dice"
    - "iou"
    - "hd95"
  eval_batch_size: 1
  report_dir: "reports"
  export_predictions: false

corruptions:
  families:
    - name: "gaussian_noise"
      type: "additive_noise"
      levels:
        mild: 0.02
        moderate: 0.05
        severe: 0.10
    - name: "gaussian_blur"
      type: "spatial_blur"
      levels:
        mild: 0.75
        moderate: 1.50
        severe: 2.50
    - name: "contrast_reduction"
      type: "intensity_scaling"
      levels:
        mild: 0.75
        moderate: 0.50
        severe: 0.25

preprocessing:
  baseline:
    normalization: "z_score"
    clip_percentiles: [0.5, 99.5]
  interventions:
    denoising_filters: ["gaussian", "median"]
    contrast_enhancement: ["clahe", "histogram_equalization"]

postprocessing:
  baseline: "argmax"
  interventions:
    largest_connected_component: true
    hole_filling: true
    min_component_size_pixels: 50
